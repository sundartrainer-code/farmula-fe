[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_RAZORPAY_KEY_ID = "rzp_live_TB0gaaVKHaMhoJ"

[[redirects]]
  from = "/backend/*"
  to = "https://farmula-bend-d8p6.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://farmula-bend-d8p6.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://farmula-bend-d8p6.onrender.com/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/subscription/*"
  to = "https://farmula-bend-d8p6.onrender.com/subscription/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lesson/*"
  to = "https://farmula-bend-d8p6.onrender.com/lesson/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/progress/*"
  to = "https://farmula-bend-d8p6.onrender.com/progress/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
